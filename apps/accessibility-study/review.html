<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <title>Revisão de imagens — Rotas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
    .counter { font-size: 0.85rem; color: #aaa; margin-bottom: 16px; }
    .label { font-size: 0.8rem; color: #ffd; background: #333; padding: 6px 12px; border-radius: 4px; margin-bottom: 12px; text-align: center; max-width: 640px; }
    img { max-width: 640px; width: 100%; border-radius: 8px; display: block; }
    .btns { display: flex; gap: 16px; margin-top: 20px; }
    button { font-size: 1.1rem; padding: 14px 40px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .yes { background: #22c55e; color: #000; }
    .no  { background: #ef4444; color: #fff; }
    .yes:hover { background: #16a34a; }
    .no:hover  { background: #b91c1c; }
    kbd { display: inline-block; background: #444; border-radius: 3px; padding: 1px 6px; font-size: 0.8rem; }
    .hint { color: #888; font-size: 0.78rem; margin-top: 8px; }
    #done { display: none; max-width: 640px; width: 100%; }
    #done h2 { margin-bottom: 12px; }
    #done pre { background: #1e1e1e; padding: 16px; border-radius: 8px; font-size: 0.75rem; overflow-x: auto; white-space: pre-wrap; }
    .tag-no  { color: #ef4444; font-weight: 700; }
    .tag-yes { color: #22c55e; }
  </style>
</head>
<body>

<div id="review">
  <h1>Revisão de imagens das rotas</h1>
  <p class="counter" id="counter"></p>
  <div class="label" id="imgLabel"></div>
  <img id="img" src="" alt="" />
  <div class="btns">
    <button class="yes" onclick="vote(true)">Sim — OK <kbd>S</kbd></button>
    <button class="no"  onclick="vote(false)">Não — Trocar <kbd>N</kbd></button>
  </div>
  <p class="hint">Pressione <kbd>S</kbd> ou <kbd>N</kbd></p>
</div>

<div id="done">
  <h2>Revisão concluída</h2>
  <p id="summary"></p>
  <pre id="output"></pre>
</div>

<script>
const IMAGES = [
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_3909.jpg",  label: "Par 6 — Rota A cena 1 (acessível)", id: "pittsburgh_3909" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_7319.jpg",  label: "Par 6 — Rota A cena 2 (acessível)", id: "pittsburgh_7319" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_20.jpg",    label: "Par 6 — Rota A cena 3 (acessível)", id: "pittsburgh_20" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_4229.jpg",  label: "Par 6 — Rota B cena 1 (padrão)",   id: "pittsburgh_4229" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_102.jpg",   label: "Par 6 — Rota B cena 2 (padrão)",   id: "pittsburgh_102" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_8532.jpg",  label: "Par 6 — Rota B cena 3 (padrão)",   id: "pittsburgh_8532" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_15078.jpg", label: "Par 2 — Rota A cena 1 (padrão)",   id: "pittsburgh_15078" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_33.jpg",    label: "Par 2 — Rota A cena 2 (padrão)",   id: "pittsburgh_33" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_13230.jpg", label: "Par 2 — Rota A cena 3 (padrão)",   id: "pittsburgh_13230" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_2895.jpg",  label: "Par 2 — Rota B cena 1 (acessível)",id: "pittsburgh_2895" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_7953.jpg",  label: "Par 2 — Rota B cena 2 (acessível)",id: "pittsburgh_7953" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_10016.jpg", label: "Par 2 — Rota B cena 3 (acessível)",id: "pittsburgh_10016" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_14624.jpg", label: "Par 23 — Rota A cena 1 (acessível)",id: "pittsburgh_14624" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_23801.jpg", label: "Par 23 — Rota A cena 2 (acessível)",id: "pittsburgh_23801" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_1134.jpg",  label: "Par 23 — Rota A cena 3 (acessível)",id: "pittsburgh_1134" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_20145.jpg", label: "Par 23 — Rota B cena 1 (padrão)",  id: "pittsburgh_20145" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_7247.jpg",  label: "Par 23 — Rota B cena 2 (padrão)",  id: "pittsburgh_7247" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_16205.jpg", label: "Par 23 — Rota B cena 3 (padrão)",  id: "pittsburgh_16205" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_20162.jpg", label: "Par 25 — Rota A cena 1 (padrão)",  id: "pittsburgh_20162" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_4230.jpg",  label: "Par 25 — Rota A cena 2 (padrão)",  id: "pittsburgh_4230" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_13472.jpg", label: "Par 25 — Rota A cena 3 (padrão)",  id: "pittsburgh_13472" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_2093.jpg",  label: "Par 25 — Rota B cena 1 (acessível)",id: "pittsburgh_2093" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_2173.jpg",  label: "Par 25 — Rota B cena 2 (acessível)",id: "pittsburgh_2173" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_2175.jpg",  label: "Par 25 — Rota B cena 3 (acessível)",id: "pittsburgh_2175" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_2455.jpg",  label: "Par 28 — Rota A cena 1 (acessível)",id: "pittsburgh_2455" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_2509.jpg",  label: "Par 28 — Rota A cena 2 (acessível)",id: "pittsburgh_2509" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_2510.jpg",  label: "Par 28 — Rota A cena 3 (acessível)",id: "pittsburgh_2510" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_15073.jpg", label: "Par 28 — Rota B cena 1 (padrão)",  id: "pittsburgh_15073" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_8026.jpg",  label: "Par 28 — Rota B cena 2 (padrão)",  id: "pittsburgh_8026" },
  { src: "../../data/generalization/images/pittsburgh/pittsburgh_28249.jpg", label: "Par 28 — Rota B cena 3 (padrão)",  id: "pittsburgh_28249" },
];

let idx = 0;
const results = [];

function show() {
  const img = IMAGES[idx];
  document.getElementById('counter').textContent = `${idx + 1} / ${IMAGES.length}`;
  document.getElementById('imgLabel').textContent = img.label;
  document.getElementById('img').src = img.src;
}

function vote(ok) {
  results.push({ id: IMAGES[idx].id, label: IMAGES[idx].label, ok });
  idx++;
  if (idx >= IMAGES.length) {
    finish();
  } else {
    show();
  }
}

function finish() {
  document.getElementById('review').style.display = 'none';
  document.getElementById('done').style.display = 'block';
  const bad = results.filter(r => !r.ok);
  document.getElementById('summary').textContent =
    `${bad.length} imagens para trocar de ${results.length} total.`;
  const lines = results.map(r =>
    `${r.ok ? 'OK  ' : 'TROCAR'} ${r.id.padEnd(25)} ${r.label}`
  );
  document.getElementById('output').textContent = lines.join('\n');
}

document.addEventListener('keydown', e => {
  if (idx >= IMAGES.length) return;
  if (e.key === 's' || e.key === 'S') vote(true);
  if (e.key === 'n' || e.key === 'N') vote(false);
});

show();
</script>
</body>
</html>
